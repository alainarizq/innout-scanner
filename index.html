<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>INNOUT FITNESS - Check In</title>

  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

  <style>

    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 30px;
    }

    .container {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      text-align: center;
    }

    h1 {
      margin-bottom: 5px;
    }

    .subtitle {
      color: #666;
      margin-bottom: 25px;
    }

    #reader {
      width: 100%;
      margin: auto;
    }

    #result {
      margin-top: 20px;
      padding: 15px;
      border-radius: 10px;
      font-weight: bold;
      min-height: 25px;
    }

  </style>
</head>

<body>

  <div class="container">

    <h1>INNOUT FITNESS</h1>

    <div class="subtitle">
      Member Check-In
    </div>

    <div id="reader"></div>

    <div id="result">
      Arahkan QR Member ke kamera
    </div>

  </div>


  <script>

  const API_URL = "https://script.google.com/macros/s/AKfycbzt34FfeI1QZnvPdQPnZ78vyrm0ba0uBR9jLJVvYC0/dev";

  let isProcessing = false;
  let currentScript = null;


  function showResult(message) {

    document.getElementById("result").innerText = message;

  }


  function processCheckIn(memberId) {

    if (isProcessing) {
      return;
    }

    isProcessing = true;

    showResult(
      "⏳ Memverifikasi " + memberId + "..."
    );


    const callbackName =
      "checkInCallback_" + Date.now();


    let finished = false;


    // Callback dari Apps Script
  window[callbackName] = function(response) {

  if (finished) {
    return;
  }

  finished = true;


  if (response.success) {

    document.getElementById("result").innerHTML = `

      <div style="
        text-align:center;
        line-height:1.6;
      ">

        <div style="
          font-size:28px;
          margin-bottom:10px;
        ">
          ✅
        </div>

        <div style="
          font-size:22px;
          font-weight:bold;
          margin-bottom:15px;
        ">
          CHECK-IN BERHASIL
        </div>

        <div>
          <strong>${response.nama}</strong>
        </div>

        <div>
          ${response.memberId}
        </div>

        <br>

        <div>
          Paket: ${response.paket}
        </div>

        <div>
          Aktif sampai: ${response.tanggalExpired}
        </div>

      </div>

    `;

  } else {

    document.getElementById("result").innerHTML = `

      <div style="
        text-align:center;
        line-height:1.6;
      ">

        <div style="
          font-size:28px;
          margin-bottom:10px;
        ">
          ❌
        </div>

        <div style="
          font-size:22px;
          font-weight:bold;
          margin-bottom:15px;
        ">
          ${response.message}
        </div>

        ${
          response.nama
          ?
          `
          <div>
            <strong>${response.nama}</strong>
          </div>

          <div>
            ${response.memberId}
          </div>

          <br>

          <div>
            Expired:
            ${response.tanggalExpired}
          </div>
          `
          :
          `
          <div>
            Periksa kembali Member ID.
          </div>
          `
        }

      </div>

    `;

  }


  cleanup();


  setTimeout(function() {

    isProcessing = false;

    showResult(
      "Arahkan QR Member ke kamera"
    );

  }, 3000);

};


      // Bisa scan lagi setelah 2 detik
      setTimeout(function() {

        isProcessing = false;

        showResult(
          "Arahkan QR Member ke kamera"
        );

      }, 2500);

    };


    function cleanup() {

      delete window[callbackName];


      if (currentScript) {

        currentScript.remove();

        currentScript = null;

      }

    }


    const url =
      API_URL +
      "?api=checkin" +
      "&memberId=" +
      encodeURIComponent(memberId) +
      "&callback=" +
      callbackName;


    currentScript =
      document.createElement("script");


    currentScript.src = url;


    currentScript.onerror = function() {

      if (finished) {
        return;
      }

      finished = true;

      showResult(
        "⚠️ Gagal menghubungi server"
      );

      cleanup();


      setTimeout(function() {

        isProcessing = false;

        showResult(
          "Arahkan QR Member ke kamera"
        );

      }, 2500);

    };


    document.body.appendChild(currentScript);


    // Timeout 15 detik
    setTimeout(function() {

      if (finished) {
        return;
      }

      finished = true;

      showResult(
        "⚠️ Server terlalu lama merespons"
      );

      cleanup();


      setTimeout(function() {

        isProcessing = false;

        showResult(
          "Arahkan QR Member ke kamera"
        );

      }, 2500);

    }, 15000);

  }


  function onScanSuccess(decodedText, decodedResult) {

    if (isProcessing) {
      return;
    }


    console.log(
      "QR terbaca:",
      decodedText
    );


    processCheckIn(decodedText);

  }


  function onScanFailure(error) {

    // Abaikan error ketika QR belum terbaca.

  }


  const scanner =
    new Html5QrcodeScanner(

      "reader",

      {
        fps: 10,

        qrbox: {
          width: 250,
          height: 250
        }
      },

      false

    );


  scanner.render(
    onScanSuccess,
    onScanFailure
  );

</script>

</body>
</html>
